<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FAQ Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #1a1f2e, #16213e);
      border: 1px solid #2a3147;
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bot-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #4f8ef7, #7c3aed);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .bot-info h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e8eaf0;
      letter-spacing: 0.2px;
    }

    .bot-info p {
      font-size: 12px;
      color: #6b7694;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Messages area */
    .chat-messages {
      background: #13161f;
      border: 1px solid #2a3147;
      border-top: none;
      border-bottom: none;
      height: 460px;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #2a3147; border-radius: 2px; }

    /* Message bubbles */
    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.bot .msg-avatar { background: linear-gradient(135deg, #4f8ef7, #7c3aed); }
    .message.user .msg-avatar { background: #1e2535; color: #6b7694; }

    .bubble {
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.bot .bubble {
      background: #1a1f2e;
      color: #d4d8e8;
      border: 1px solid #2a3147;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #4f8ef7, #5b6cf5);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Intent badge */
    .intent-badge {
      font-size: 10px;
      color: #4f8ef7;
      background: rgba(79,142,247,0.1);
      border: 1px solid rgba(79,142,247,0.2);
      padding: 2px 7px;
      border-radius: 20px;
      margin-top: 5px;
      display: inline-block;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background: #1a1f2e;
      border: 1px solid #2a3147;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #4f8ef7;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Input area */
    .chat-input-area {
      background: #1a1f2e;
      border: 1px solid #2a3147;
      border-top: 1px solid #2a3147;
      border-radius: 0 0 16px 16px;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #user-input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2a3147;
      color: #d4d8e8;
      font-size: 14px;
      font-family: inherit;
      padding: 11px 16px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #4f8ef7; }
    #user-input::placeholder { color: #3d4460; }

    #send-btn {
      background: linear-gradient(135deg, #4f8ef7, #5b6cf5);
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #send-btn:hover { opacity: 0.88; }
    #send-btn:active { transform: scale(0.95); }

    /* Suggestion chips */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 12px 20px 0;
      background: #13161f;
      border-left: 1px solid #2a3147;
      border-right: 1px solid #2a3147;
    }

    .chip {
      background: #1a1f2e;
      border: 1px solid #2a3147;
      color: #8b93b5;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .chip:hover {
      background: rgba(79,142,247,0.1);
      border-color: #4f8ef7;
      color: #4f8ef7;
    }
  </style>
</head>
<body>

<div class="chat-wrapper">
  <!-- Header -->
  <div class="chat-header">
    <div class="bot-avatar">🤖</div>
    <div class="bot-info">
      <h1>FAQ Assistant</h1>
      <p><span class="status-dot"></span>Online · NLP-powered</p>
    </div>
  </div>

  <!-- Suggestion chips -->
  <div class="suggestions" id="suggestions">
    <button class="chip" onclick="sendChip(this)">What are your hours?</button>
    <button class="chip" onclick="sendChip(this)">How do I contact you?</button>
    <button class="chip" onclick="sendChip(this)">What's the pricing?</button>
    <button class="chip" onclick="sendChip(this)">Refund policy</button>
    <button class="chip" onclick="sendChip(this)">How to sign up?</button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chat-messages">
    <div class="message bot">
      <div class="msg-avatar">🤖</div>
      <div>
        <div class="bubble">Hi! I'm your FAQ assistant. Ask me anything about pricing, support, accounts, or features.</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off" />
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("chat-messages");
  const inputEl = document.getElementById("user-input");

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  function sendChip(btn) {
    inputEl.value = btn.textContent;
    sendMessage();
  }

  function appendMessage(text, role, intent = null, confidence = null) {
    const wrap = document.createElement("div");
    wrap.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "msg-avatar";
    avatar.textContent = role === "bot" ? "🤖" : "👤";

    const right = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    right.appendChild(bubble);

    if (role === "bot" && intent && intent !== "unknown") {
      const badge = document.createElement("span");
      badge.className = "intent-badge";
      badge.textContent = `intent: ${intent} · ${Math.round(confidence * 100)}%`;
      right.appendChild(badge);
    }

    wrap.appendChild(avatar);
    wrap.appendChild(right);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "message bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    inputEl.value = "";
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      setTimeout(() => {
        removeTyping();
        appendMessage(data.response, "bot", data.intent, data.confidence);
      }, 600);
    } catch (err) {
      removeTyping();
      appendMessage("Sorry, something went wrong. Please try again.", "bot");
    }
  }
</script>
</body>
</html>
